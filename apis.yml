aid: docplanner
name: Docplanner
description: >-
  Docplanner Group is a healthcare technology company that connects patients with doctors and
  equips medical practices with SaaS tools to manage online bookings, calendars, patient
  communication, reminders, payments, and online reputation. It operates a patient-facing
  marketplace plus a practice-management platform across 13 countries under brands including
  Doctoralia (Spain, Mexico, Brazil, Portugal, and Latin America), ZnanyLekarz (Poland),
  MioDottore (Italy), Doktor Takvimi (Turkey), Jameda (Germany), and the TuoTempo
  practice-management/booking platform. The group serves over 300,000 active doctors and
  handles roughly 25 million appointment bookings each month. Docplanner is backed by
  Point Nine among other investors.
